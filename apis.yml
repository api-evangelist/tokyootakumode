aid: tokyootakumode
name: TokyoOtakuMode
description: >-
  Tokyo Otaku Mode (TOM) is a Japan-based e-commerce company and online
  destination for fans of Japanese pop culture, selling official anime figures,
  manga merchandise, apparel, and collectibles worldwide through its
  otakumode.com shop. Grown out of a large social-media following, TOM curates
  and ships Japanese otaku goods internationally. It runs a private,
  API-key-gated backend (api.otakumode.com) that powers its storefront, but
  publishes no public developer program, API documentation, OpenAPI/AsyncAPI
  specifications, or first-party client SDKs. This profile was surfaced as a
  500 Global portfolio company and enriched from live public probes.
